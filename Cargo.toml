[workspace]
resolver = "3"
members = [
    "crates/parley-domain",
    "crates/parley-service",
    "crates/parley-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
parley-domain = { path = "crates/parley-domain" }
parley-service = { path = "crates/parley-service" }

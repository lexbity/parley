      - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      - {in: query, name: status, required: false, schema: {type: string, enum: [open, resolved, dormant, closed]}}
      - {in: query, name: party_id, required: false, schema: {type: string}}

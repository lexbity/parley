              required: [name, body, stage_class, channel, sentence_rules]
              properties:
                name: {type: string}
                body: {type: string}
                proof_fallback: {type: [string, 'null']}
                stage_class: {type: string}
                channel: {type: string}
                sentence_rules: {type: array, items: {type: array, items: {type: string}}}
                parent_version_id: {type: [string, 'null']}
      responses: {'201': {description: Immutable draft template version}}
  /opportunities/{id}/materials/compose:
    post:
      operationId: composeOpportunityMaterial
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipient_id, kind, template_version_id, exchange_version, slot_fills]
              properties:
                recipient_id: {type: string}
                kind: {type: string, enum: [outreach, followup, handoff]}
                template_version_id: {type: string}
                exchange_version: {type: integer, minimum: 1}
                slot_fills: {type: array, items: {$ref: '#/components/schemas/SlotFill'}}
                selected_match_ids: {type: array, items: {type: string}}
      responses: {'202': {description: Owner-review-only composition job queued}}
  /opportunities/{id}/materials/compose/{job_id}/save:
    post:
      operationId: saveComposerProposal
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: path, name: job_id, required: true, schema: {type: string}}, {$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [body], properties: {body: {type: string, minLength: 1, maxLength: 20000}}}}}
      responses: {'201': {description: Staged immutable material draft; unapproved and unreleased}}
  /materials/{id}/lint:
    post:
      operationId: lintMaterial
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [version, content_sha256], properties: {version: {type: integer, minimum: 1}, content_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}}}}}
      responses: {'202': {description: Deterministic findings persisted and advisory lint queued}}
  /settings/maintenance:
    get:
      operationId: getMaintenanceSettings
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}]
      responses:
        '200': {description: Owner-selected backup and retention settings., content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceSettings'}}}}
    put:
      operationId: updateMaintenanceSettings
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceSettingsInput'}}}
      responses:
        '200': {description: Settings updated with revision check., content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceSettings'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /backups:
    get:
      operationId: listBackups
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}]
      responses:
        '200': {description: Verified and damaged snapshots with manifest details., content: {application/json: {schema: {$ref: '#/components/schemas/BackupList'}}}}
    post:
      operationId: createBackup
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201': {description: Consistent SQLite snapshot and pinned referenced blobs published manifest-last., content: {application/json: {schema: {$ref: '#/components/schemas/BackupRecord'}}}}
  /exports:
    post:
      operationId: createFullExport
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Owner data archive, distinct from recipient-facing release., content: {application/zip: {schema: {type: string, format: binary}}}}
  /imports/preview:
    post:
      operationId: previewFullImport
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}]
      requestBody:
        required: true
        content: {application/zip: {schema: {type: string, format: binary}}}
      responses:
        '200': {description: Format, hashes, entries, required space and empty-target check., content: {application/json: {schema: {$ref: '#/components/schemas/ImportPreview'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /imports/commit:
    post:
      operationId: commitFullImport
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ImportCommitInput'}}}
      responses:
        '202': {description: Verified archive committed to a fresh generation; client reconnects after restart., content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceOperation'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /restore/preview:
    post:
      operationId: previewRestore
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RestorePreviewInput'}}}
      responses:
        '200': {description: Backup hashes, compatibility, disk requirements and erasure resurrection effects., content: {application/json: {schema: {$ref: '#/components/schemas/RestorePreview'}}}}
  /restore/commit:
    post:
      operationId: commitRestore
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RestoreCommitInput'}}}
      responses:
        '202': {description: Verified replacement generation published; rotate epoch and restart before completion., content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceOperation'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /parties/{id}/erase/preview:
    post:
      operationId: previewPartyErasure
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}]
      responses:
        '200': {description: Erasure closure, shared sources and external owner-managed copies., content: {application/json: {schema: {$ref: '#/components/schemas/ErasePreview'}}}}
  /parties/{id}/erase:
    post:
      operationId: eraseParty
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EraseCommitInput'}}}
      responses:
        '202': {description: Erasure committed to a replacement generation; poll after reconnect until old bytes are retired and checked., content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceOperation'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /maintenance/operations/{id}:
    get:
      operationId: getMaintenanceOperation
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {$ref: '#/components/parameters/Epoch'}]
      responses:
        '200': {description: Operation status; complete erasure means retired bytes and canary validation passed., content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceOperation'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /resource-board:
    get:
      operationId: getResourceBoard
      security: [{sessionCookie: []}]
      parameters:
      - in: query
        name: limit
        required: false
        schema: {type: integer, minimum: 1, maximum: 500}
      - in: query
        name: cursor
        required: false
        schema: {type: string}
      - in: query
        name: include_offboard
        required: false
        schema: {type: boolean}
      responses:
        '200':
          description: Ordered columns and paged card summaries with counts, placement revisions and the event fence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceBoardSnapshot'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /resource-board/columns:
    post:
      operationId: createResourceColumn
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateResourceColumn'}}}
      responses:
        '201': {description: List appended to the resource board., content: {application/json: {schema: {$ref: '#/components/schemas/ResourceColumn'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /resource-board/columns/{id}:
    delete:
      operationId: removeResourceColumn
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RemoveResourceColumn'}}}
      responses:
        '200': {description: List removed and its resources moved off the board., content: {application/json: {schema: {$ref: '#/components/schemas/RemovedResourceColumn'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
    patch:
      operationId: renameResourceColumn
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RenameResourceColumn'}}}
      responses:
        '200': {description: List renamed in place under its revision guard., content: {application/json: {schema: {$ref: '#/components/schemas/ResourceColumn'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /resource-cards/{id}:
    get:
      operationId: getResourceCard
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Full card read for the shared editor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/EntityCard'}
                additionalProperties: false
        '404': {$ref: '#/components/responses/Error'}
  /resource-cards/{id}/deliveries:
    get:
      operationId: getResourceCardDeliveries
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Derived delivery rows for the resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryList'}
        '404': {$ref: '#/components/responses/Error'}
  /resource-cards/{id}/retire:
    post:
      operationId: retireResourceCard
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200':
          description: Card retired; affected material versions flagged for release recheck.
          content:
            application/json:
              schema:
                type: object
                required: [entity, affected_versions]
                properties:
                  entity:
                    type: object
                    required: [id, kind, readiness, revision]
                    properties:
                      id: {type: string}
                      kind: {type: string}
                      readiness: {type: string}
                      revision: {type: integer}
                    additionalProperties: false
                  affected_versions:
                    type: array
                    items:
                      type: object
                      required: [material_id, version_no]
                      properties:
                        material_id: {type: string}
                        version_no: {type: integer}
                      additionalProperties: false
                additionalProperties: false
        '404': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
  /resource-cards/{id}/erase:
    post:
      operationId: eraseResourceCard
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200':
          description: Card erased with its edges, attachments and placement; the tombstone makes later reads report RESOURCE_ERASED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErasedResourceCard'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: Provenance must outlive the card; archive the card instead.
          content:
            application/json:
              schema: {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
  /resource-cards/{id}/deliveries/{send_id}/{material_id}/{version}:
    get:
      operationId: getDeliveredResourceVersion
      security: [{sessionCookie: []}]
      parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: send_id, in: path, required: true, schema: {type: string}}
      - {name: material_id, in: path, required: true, schema: {type: string}}
      - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Exact material version recorded as delivered with this resource.
          content:
            application/json:
              schema:
                type: object
                required: [resource_title, resource_revision, body, filename]
                properties:
                  resource_title: {type: string}
                  resource_revision: {type: integer}
                  body: {type: string}
                  filename: {type: string, nullable: true}
                additionalProperties: false
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /resource-card-commits:
    post:
      operationId: commitResourceCard
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResourceCardCommitInput'}}}
      responses:
        '201':
          description: New card, entity, placement and any related edge committed atomically.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceCardCommitResult'}
        '200':
          description: Edited card committed atomically.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceCardCommitResult'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /resource-board/moves:
    post:
      operationId: moveResourceCard
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MutationToken'}, {$ref: '#/components/parameters/Epoch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MoveResourceCardInput'}}}
      responses:
        '200':
          description: Placement committed; null placement means the card left the board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MoveResourceCardResult'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: parley_session
  parameters:
    MutationToken:
      in: header
      name: X-Parley-Token
      required: true
      schema:
        type: string
    Epoch:
      in: header
      name: X-Parley-Epoch
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    CommandIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Bounded invocation key. A retry reuses this key with the same version and canonical arguments.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{1,128}$'
    AgentIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Bounded run/cancel key. A retry with the same key and epoch reuses the original run.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{1,128}$'
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CommandError:
      description: Stable command error envelope with a typed detail array.
      headers:
        Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandErrorEnvelope'
    CommandRunFailure:
      description: Stable command invocation failure envelope with a typed detail array.
      headers:
        Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandRunFailure'
    AgentError:
      description: Stable delegated-run error envelope with a typed detail array.
      headers:
        Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
        X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentErrorEnvelope'
  headers:
    PrivateNoStore:
      description: Owner command responses are private and must not be stored by any cache.
      schema: {type: string, const: 'private, no-store'}
    ParleyEpoch:
      description: Workspace epoch that produced the command response.
      schema: {type: string, minLength: 1}
  schemas:
    Health:
      type: object
      required:
      - status
      - model
      properties:
        status:
          type: string
          const: ready
        model:
          type: string
          const: not-probed
      additionalProperties: false
    BootstrapRequest:
      type: object
      required:
      - secret
      properties:
        secret:
          type: string
          minLength: 64
          maxLength: 64
      additionalProperties: false
    Session:
      type: object
      required:
      - workspace_id
      - epoch
      - wire_major
      - wire_minor
      - capabilities
      - mutation_token
      - cursor
      properties:
        workspace_id:
          type: string
        epoch:
          type: string
        wire_major:
          type: integer
        wire_minor:
          type: integer
        capabilities:
          type: array
          items:
            type: string
        mutation_token:
          type: string
        cursor:
          type: string
      additionalProperties: false
    Resource:
      type: object
      required:
      - id
      - kind
      - title
      - body
      - readiness
      - revision
      - etag
      properties:
        id:
          type: string
        kind:
          enum:
          - gift
          - proof
          - artifact
        title:
          type: string
        body:
          type: object
          additionalProperties: true
        readiness:
          enum:
          - draft
          - ready
          - retired
        revision:
          type: integer
          minimum: 1
        etag:
          type: string
      additionalProperties: false
    EdgeWrite:
      type: object
      required:
      - from_id
      - to_id
      - verb
      - occurrence_id
      - quote
      - expected_from_revision
      - expected_to_revision
      properties:
        from_id:
          type: string
          minLength: 1
        to_id:
          type: string
          minLength: 1
        verb:
          type: string
          minLength: 1
        occurrence_id:
          type: string
          minLength: 1
        quote:
          type: string
          minLength: 1
        expected_from_revision:
          type: integer
          minimum: 1
        expected_to_revision:
          type: integer
          minimum: 1
      additionalProperties: false
    EdgeCorrection:
      type: object
      required:
      - from_id
      - to_id
      - verb
      - occurrence_id
      - quote
      - expected_from_revision
      - expected_to_revision
      - expected_revision
      properties:
        from_id:
          type: string
          minLength: 1
        to_id:
          type: string
          minLength: 1
        verb:
          type: string
          minLength: 1
        occurrence_id:
          type: string
          minLength: 1
        quote:
          type: string
          minLength: 1
        expected_from_revision:
          type: integer
          minimum: 1
        expected_to_revision:
          type: integer
          minimum: 1
        expected_revision:
          type: integer
          minimum: 1
      additionalProperties: false
    OwnerEdgeCorrection:
      type: object
      required: [expected_revision, verb, basis]
      properties:
        expected_revision: {type: integer, minimum: 1}
        verb: {type: string, minLength: 1, maxLength: 120}
        basis: {type: string, minLength: 1, maxLength: 2000}
        reverse: {type: boolean, default: false}
      additionalProperties: false
    EdgeRemoval:
      type: object
      required:
      - expected_revision
      properties:
        expected_revision:
          type: integer
          minimum: 1
      additionalProperties: false
    EdgeReceipt:
      type: object
      required:
      - id
      - from_id
      - to_id
      - verb
      - revision
      properties:
        id:
          type: string
          minLength: 1
        from_id:
          type: string
          minLength: 1
        to_id:
          type: string
          minLength: 1
        verb:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
      additionalProperties: false
    GraphEntity:
      type: object
      required:
      - id
      - kind
      - name
      - revision
      properties:
        id:
          type: string
        kind:
          enum:
          - person
          - org
          - project
          - resource
          - source
          - interest
          - artifact
          - opportunity
          - material
        name:
          type: string
        focus:
          type: string
          description: Owner-editable short descriptor shown on the party sheet.
        etag:
          type: string
          description: Strong entity ETag for typed party edits.
        revision:
          type: integer
          minimum: 1
      additionalProperties: false
    GraphNode:
      allOf:
      - $ref: '#/components/schemas/GraphEntity'
      - type: object
        required: [x, y, position_revision]
        properties:
          x: {type: number}
          y: {type: number}
          position_revision: {type: integer, minimum: 0}
    ClaimRevisionInput:
      type: object
      required:
      - expected_revision
      - occurrence_id
      - wording
      - speaker_kind
      properties:
        expected_revision:
          type: integer
          minimum: 1
        occurrence_id:
          type: string
          minLength: 1
        wording:
          type: string
          minLength: 1
        speaker_kind:
          type: string
          enum:
          - owner
          - party
          - unknown
        speaker_entity_id:
          type: string
          nullable: true
      additionalProperties: false
    ClaimRevisionReceipt:
      type: object
      required:
      - id
      - revision
      - occurrence_id
      - wording
      - speaker_kind
      - speaker_entity_id
      properties:
        id:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
        occurrence_id:
          type: string
          minLength: 1
        wording:

  /commands/query:
    post:
      operationId: queryCommands
      summary: Return the owner's authorized Tier 1 command descriptors.
      description: Owner session, mutation token and epoch are required. Agent surfaces and tiers are rejected for owner callers.
      security: [{sessionCookie: []}]
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryCommandsInput'}
      responses:
        '200':
          description: Ordered descriptor manifest; never cached or shared.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryCommandsResult'}
        '400': {$ref: '#/components/responses/CommandError'}
        '401': {$ref: '#/components/responses/CommandError'}
        '403': {$ref: '#/components/responses/CommandError'}
  /commands/search:
    post:
      operationId: searchCommands
      summary: Search the owner's palette command catalogue.
      description: Uses the same permission filter as queryCommands and returns closed summaries without schemas or private record data.
      security: [{sessionCookie: []}]
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchCommandsInput'}
      responses:
        '200':
          description: Ranked, bounded command summaries; never cached or shared.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandSearchResult'}
        '400': {$ref: '#/components/responses/CommandError'}
        '401': {$ref: '#/components/responses/CommandError'}
        '403': {$ref: '#/components/responses/CommandError'}
  /commands/{id}:
    get:
      operationId: describeCommand
      summary: Describe one owner-visible command.
      description: Visibility follows the registry's owner filter, not a client-reported context. Concealed and absent commands return the same unknown_command envelope.
      security: [{sessionCookie: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 48}}
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Closed command descriptor; never cached or shared.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandDescriptor'}
        '401': {$ref: '#/components/responses/CommandError'}
        '403': {$ref: '#/components/responses/CommandError'}
        '404': {$ref: '#/components/responses/CommandError'}
    post:
      operationId: runCommand
      summary: Invoke one registered command through the shared application operation.
      description: Owner session, mutation token, epoch and a mandatory Idempotency-Key are required. Retries reuse the same key, version and canonical arguments.
      security: [{sessionCookie: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 48}}
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/CommandIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommandInvocationInput'}
      responses:
        '200':
          description: Committed or replayed command result; never cached or shared.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandRunSuccess'}
        '400': {$ref: '#/components/responses/CommandError'}
        '401': {$ref: '#/components/responses/CommandError'}
        '403': {$ref: '#/components/responses/CommandError'}
        '404': {$ref: '#/components/responses/CommandError'}
        '409': {$ref: '#/components/responses/CommandError'}
        '413': {$ref: '#/components/responses/CommandError'}
        '422': {$ref: '#/components/responses/CommandRunFailure'}
        '429': {$ref: '#/components/responses/CommandError'}
        '500': {$ref: '#/components/responses/CommandError'}
        '503': {$ref: '#/components/responses/CommandError'}
        '504': {$ref: '#/components/responses/CommandError'}
  /agent/runs:
    post:
      operationId: startAgentRun
      summary: Start one owner-approved delegated read run.
      description: >
        Owner session, mutation token, epoch and a mandatory Idempotency-Key
        are required. The permission and target grant is immutable after start.
        Tier 1 read commands are offered to the model as tool names only;
        commands__search, commands__describe and commands__run are tool names,
        not HTTP operations. The model never receives owner session credentials.
      security: [{sessionCookie: []}]
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/AgentIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartAgentRunInput'}
      responses:
        '201':
          description: Run admitted and grant persisted; never cached or shared.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRunSummary'}
        '400': {$ref: '#/components/responses/AgentError'}
        '401': {$ref: '#/components/responses/AgentError'}
        '403': {$ref: '#/components/responses/AgentError'}
        '409': {$ref: '#/components/responses/AgentError'}
        '422': {$ref: '#/components/responses/AgentError'}
        '429': {$ref: '#/components/responses/AgentError'}
        '503': {$ref: '#/components/responses/AgentError'}
    get:
      operationId: listAgentRuns
      summary: List the owner's delegated runs, newest first.
      description: >
        Bounded, owner-scoped page. An unknown status filter is rejected; the
        limit is clamped to 1..20 and the cursor is an opaque run ID.
      security: [{sessionCookie: []}]
      parameters:
      - {in: query, name: status, required: false, schema: {$ref: '#/components/schemas/AgentRunState'}}
      - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 20, default: 10}}
      - {in: query, name: cursor, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Bounded page of run summaries; never cached or shared.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRunList'}
        '400': {$ref: '#/components/responses/AgentError'}
        '401': {$ref: '#/components/responses/AgentError'}
        '409': {$ref: '#/components/responses/AgentError'}
  /agent/runs/{id}:
    get:
      operationId: getAgentRun
      summary: Read the owner-visible state of one delegated run.
      description: A run outside the owner's epoch and pseudonym is indistinguishable from a missing run.
      security: [{sessionCookie: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Current fenced run status; never cached or shared.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRunStatus'}
        '401': {$ref: '#/components/responses/AgentError'}
        '404': {$ref: '#/components/responses/AgentError'}
        '409': {$ref: '#/components/responses/AgentError'}
  /agent/runs/{id}/transcript:
    get:
      operationId: getAgentRunTranscript
      summary: Read one bounded page of the plain-text run transcript.
      description: >
        Items are ordered by turn number and ordinal. The cursor encodes the
        last (turn_no, ordinal) pair; an invalid cursor starts from the
        beginning rather than widening the owner's scope.
      security: [{sessionCookie: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 20, default: 20}}
      - {in: query, name: cursor, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Bounded transcript page; never cached or shared.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentTranscript'}
        '401': {$ref: '#/components/responses/AgentError'}
        '404': {$ref: '#/components/responses/AgentError'}
        '409': {$ref: '#/components/responses/AgentError'}
  /agent/runs/{id}/cancel:
    post:
      operationId: cancelAgentRun
      summary: Revoke a run grant and fence any late tool result.
      description: >
        Owner session, mutation token, epoch and a mandatory Idempotency-Key
        are required. Cancellation is terminal for an active run and reports
        "unchanged" for a run that already reached a terminal state.
      security: [{sessionCookie: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/AgentIdempotencyKey'
      responses:
        '200':
          description: Cancellation committed under the writer fence; never cached or shared.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCancelResult'}
        '400': {$ref: '#/components/responses/AgentError'}
        '401': {$ref: '#/components/responses/AgentError'}
        '403': {$ref: '#/components/responses/AgentError'}
        '409': {$ref: '#/components/responses/AgentError'}
        '503': {$ref: '#/components/responses/AgentError'}
  /approvals:
    get:
      operationId: listApprovals
      summary: List owner-authorized approvals with an opaque cursor.
      description: >
        Owner session, mutation token and epoch are required. The status
        filter accepts the closed approval status set. Active rows carry the
        exact normalized args and the observational preview; terminal rows
        omit them.
      security: [{sessionCookie: []}]
      parameters:
      - {in: query, name: status, required: false, schema: {type: string, enum: [pending, granted, consumed, denied, revoked, expired, stale]}}
      - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
      - {in: query, name: cursor, required: false, schema: {type: string}}
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Paginated approval list; never cached or shared.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalList'}
        '400': {$ref: '#/components/responses/AgentError'}
        '401': {$ref: '#/components/responses/AgentError'}
        '403': {$ref: '#/components/responses/AgentError'}
  /approvals/{id}:
    get:
      operationId: getApproval
      summary: Read one approval detail (owner-only).
      description: >
        Active records include the exact private args and the preview; any
        terminal status omits both. Unknown, foreign or epoch-stale ids
        return the same 404 as a missing record.
      security: [{sessionCookie: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Approval detail with args and preview for active rows.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalDetail'}
        '401': {$ref: '#/components/responses/AgentError'}
        '403': {$ref: '#/components/responses/AgentError'}
        '404': {$ref: '#/components/responses/AgentError'}
  /approvals/{id}/grant:
    post:
      operationId: grantApproval
      summary: Approve one frozen destructive intent.
      description: >
        Posts the expected approval revision and the preview digest seen by
        the owner. A decision on a changed revision returns 409
        approval_stale; an exact replay with the same Idempotency-Key
        returns the original outcome. A deny at the current revision revokes
        a previously granted approval.
      security: [{sessionCookie: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/AgentIdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDecisionInput'}}}
      responses:
        '200':
          description: Decision committed; returns the new approval revision and status.
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Parley-Epoch: {$ref: '#/components/headers/ParleyEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalDecisionResult'}
        '400': {$ref: '#/components/responses/AgentError'}
        '401': {$ref: '#/components/responses/AgentError'}
        '403': {$ref: '#/components/responses/AgentError'}
        '404': {$ref: '#/components/responses/AgentError'}
        '409': {$ref: '#/components/responses/AgentError'}
        '422': {$ref: '#/components/responses/AgentError'}
        '503': {$ref: '#/components/responses/AgentError'}
  /approvals/{id}/deny:
    post:
      operationId: denyApproval
      summary: Deny one frozen destructive intent (revoking a grant if granted).
      description: >
        Same decision envelope as grant. A deny at the current revision of a
        granted approval revokes it; terminal denials replay exactly.

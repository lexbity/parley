    DeliveryRow:
      type: object
      required: [send_id, sent_at, recipient_id, recipient_name, opportunity_id, opportunity_title, material_id, material_version, material_kind]
      properties:
        send_id: {type: string}
        sent_at: {type: string}
        recipient_id: {type: string}
        recipient_name: {type: string}
        opportunity_id: {type: string}
        opportunity_title: {type: string}
        material_id: {type: string}
        material_version: {type: integer}
        material_kind: {type: string}
      additionalProperties: false
    DeliveryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/DeliveryRow'}
      additionalProperties: false
    MoveResourceCardInput:
      type: object
      required: [resource_id, destination_column_id]
      properties:
        resource_id: {type: string}
        destination_column_id:
          anyOf:
          - type: string
          - type: "null"
        before_resource_id:
          anyOf:
          - type: string
          - type: "null"
        expected_source_column_revision:
          anyOf:
          - type: integer
          - type: "null"
        expected_destination_column_revision:
          anyOf:
          - type: integer
          - type: "null"
        expected_placement_revision:
          anyOf:
          - type: integer
          - type: "null"
      additionalProperties: false
    MoveResourceCardResult:
      type: object
      required: [placement, source_column_revision, destination_column_revision]
      properties:
        placement:
          anyOf:
          - $ref: '#/components/schemas/PlacementView'
          - type: "null"
        source_column_revision:
          anyOf:
          - type: integer
          - type: "null"
        destination_column_revision:
          anyOf:
          - type: integer
          - type: "null"
      additionalProperties: false
    EdgeView:
      type: object
      required: [id, from_id, verb, to_id, state, revision, basis, author_kind, created_at]
      properties:
        id: {type: string}
        from_id: {type: string}
        verb: {type: string}
        to_id: {type: string}
        state: {type: string}
        revision: {type: integer}
        basis: {type: string}
        author_kind: {type: string}
        created_at: {type: string}
      additionalProperties: false
    EdgeInput:
      type: object
      required: [from_id, verb, to_id, basis]
      properties:
        from_id: {type: string}
        verb: {type: string}
        to_id: {type: string}
        basis: {type: string}
      additionalProperties: false
    CreatedEdge:
      type: object
      required: [edge]
      properties:
        edge: {$ref: '#/components/schemas/EdgeView'}
      additionalProperties: false
    UpdateEdgeInput:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: {type: integer}
        verb:
          anyOf:
          - type: string
          - type: "null"
        basis:
          anyOf:
          - type: string
          - type: "null"
      additionalProperties: false
    UpdatedEdge:
      type: object
      required: [edge, author_kind]
      properties:
        edge: {$ref: '#/components/schemas/EdgeView'}
        author_kind: {type: string}
      additionalProperties: false
    EntityAttachment:
      type: object
      required: [id, entity_id, upload_id, filename, content_type, size, sha256, share_permission, reviewed_by_owner, created_at]
      properties:
        id: {type: string}
        entity_id: {type: string}
        upload_id: {type: string}
        filename: {type: string}
        content_type: {type: string}
        size: {type: integer}
        sha256: {type: string}
        share_permission: {type: boolean}
        reviewed_by_owner: {type: boolean}
        created_at: {type: string}
      additionalProperties: false
    AttachmentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/EntityAttachment'}
      additionalProperties: false
    BindAttachmentInput:
      type: object
      required: [upload_id]
      properties:
        upload_id: {type: string}
      additionalProperties: false
    BoundAttachment:
      type: object
      required: [attachment]
      properties:
        attachment: {$ref: '#/components/schemas/EntityAttachment'}
      additionalProperties: false
    CommandErrorDetail:
      type: object
      description: One stable JSON Pointer path and typed problem code; never a validation-engine message.
      required: [path, problem]
      properties:
        path: {type: string, maxLength: 512}
        problem: {type: string, maxLength: 120}
      additionalProperties: false
    CommandError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          enum:
          - malformed_request
          - unauthenticated
          - origin_denied
          - unsupported_media_type
          - forbidden
          - approval_required
          - approval_invalid
          - unknown_command
          - target_unavailable
          - conflict
          - epoch_changed
          - version_mismatch
          - operation_in_progress
          - approval_stale
          - cursor_stale
          - requires_owner_workflow
          - request_too_large
          - result_too_large
          - invalid_args
          - idempotency_mismatch
          - budget_exceeded
          - unavailable
          - timeout
          - internal
        message: {type: string, maxLength: 2048}
        details:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/CommandErrorDetail'}
      additionalProperties: false
    CommandErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/CommandError'}
      additionalProperties: false
    QueryCommandsInput:
      type: object
      required: [surface]
      properties:
        surface: {type: string, const: palette}
        context:
          type: object
          maxProperties: 16
          additionalProperties: {type: [string, boolean]}
      additionalProperties: false
    CommandPaletteSpec:
      type: object
      required: [context_fields, prompts]
      properties:
        context_fields:
          type: array
          maxItems: 16
          items: {type: string}
        prompts:
          type: array
          maxItems: 8
          items:
            type: object
            required: [field, picker, title]
            properties:
              field: {type: string, minLength: 1}
              picker: {type: string, enum: [party, planning_stage, opportunity_task]}
              title: {type: string, minLength: 1}
            additionalProperties: false
      additionalProperties: false
    CommandDescriptor:
      type: object
      description: Closed descriptor published only after boot validation; schemas are self-contained Draft 2020-12 objects.
      required: [id, version, title, summary, description, keywords, effect, requires_permission, surfaces, args_schema, result_schema, supports_dry_run, palette]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$', maxLength: 48}
        version: {type: integer, minimum: 1}
        title: {type: string, maxLength: 60}
        summary: {type: string, maxLength: 140}
        description: {type: string, maxLength: 1024}
        keywords: {type: array, maxItems: 16, items: {type: string}}
        effect: {type: string, enum: [read, write, destructive]}
        requires_permission: {type: string, minLength: 1}
        surfaces: {type: array, items: {type: string, enum: [palette, agent]}}
        agent_tier: {type: integer, minimum: 1, maximum: 2}
        args_schema: {type: object, additionalProperties: true}
        result_schema: {type: object, additionalProperties: true}
        supports_dry_run: {type: boolean}
        when: {type: string, maxLength: 512}
        palette: {$ref: '#/components/schemas/CommandPaletteSpec'}
      additionalProperties: false
    QueryCommandsResult:
      type: object
      required: [contract_major, manifest_version, truncated, commands]
      properties:
        contract_major: {type: integer, const: 1}
        manifest_version: {type: string, minLength: 1}
        truncated: {type: boolean}
        commands:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/CommandDescriptor'}
      additionalProperties: false
    SearchCommandsInput:
      type: object
      required: [query]
      properties:
        query: {type: string, maxLength: 256}
        limit: {type: integer, minimum: 1, maximum: 25}
        context:
          type: object
          maxProperties: 16
          additionalProperties: {type: [string, boolean]}
      additionalProperties: false
    CommandSummary:
      type: object
      required: [id, version, title, summary, effect]
      properties:
        id: {type: string, minLength: 1, maxLength: 48}
        version: {type: integer, minimum: 1}
        title: {type: string, maxLength: 60}
        summary: {type: string, maxLength: 140}
        effect: {type: string, enum: [read, write, destructive]}
      additionalProperties: false
    CommandSearchResult:
      type: object
      required: [items, total, next_cursor]
      properties:
        items:
          type: array
          maxItems: 25
          items: {$ref: '#/components/schemas/CommandSummary'}
        total: {type: integer, minimum: 0}
        next_cursor: {type: [string, 'null']}
      additionalProperties: false
    CommandInvocationInput:
      type: object
      required: [version, args]
      properties:
        version: {type: integer, minimum: 1}
        args: {type: object, minProperties: 1}
        dry_run: {type: boolean}
      additionalProperties: false
    CommandRunSuccess:
      type: object
      required: [ok, command_version, audit_id, original_audit_id, replayed, dry_run, result]
      properties:
        ok: {type: boolean, const: true}
        command_version: {type: integer, minimum: 1}
        audit_id: {type: string, minLength: 1}
        original_audit_id: {type: [string, 'null']}
        replayed: {type: boolean}
        dry_run: {type: boolean}
        result: {type: object}
      additionalProperties: false
    CommandRunFailure:
      type: object
      required: [ok, command_version, error]
      properties:
        ok: {type: boolean, const: false}
        command_version: {type: integer, minimum: 1}
        audit_id: {type: string, minLength: 1}
        error: {$ref: '#/components/schemas/CommandError'}
      additionalProperties: false
    CommandRunResult:
      oneOf:
      - $ref: '#/components/schemas/CommandRunSuccess'
      - $ref: '#/components/schemas/CommandRunFailure'
    AgentRunState:
      type: string
      description: Closed delegated-run state machine, including waiting and terminal states.
      enum: [queued, running, waiting_owner, waiting_job, succeeded, failed, cancelled, expired]
    AgentPermission:
      type: string
      description: Closed permission value an owner may grant to a delegated run.
      enum: [opportunity.phase.edit, party.read, opportunity.read, opportunity.create, party.edit, opportunity.task.edit]
    AgentRunTarget:
      type: object
      description: One immutable target record in the owner-approved grant.
      required: [kind, id]
      properties:
        kind: {type: string, enum: [party, opportunity, resource, material, segment]}
        id: {type: string, minLength: 1, maxLength: 200}
      additionalProperties: false
    StartAgentRunInput:
      type: object
      required: [task, targets, permissions]
      properties:
        task: {type: string, minLength: 1, maxLength: 8192}
        targets:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/AgentRunTarget'}
        permissions:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: '#/components/schemas/AgentPermission'}
        allow_created_opportunities: {type: boolean, default: false}
      additionalProperties: false
    AgentRunSummary:
      type: object
      description: Admission receipt carrying the immutable grant and the initial run state.
      required: [run_id, state, revision, granted_actions, targets, deadline_at, phase]
      properties:
        run_id: {type: string, minLength: 1, maxLength: 128}
        state: {$ref: '#/components/schemas/AgentRunState'}
        revision: {type: integer, minimum: 1}
        granted_actions:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: '#/components/schemas/AgentPermission'}
        targets:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/AgentRunTarget'}
        deadline_at: {type: string, format: date-time}
        phase: {$ref: '#/components/schemas/AgentRunState'}
      additionalProperties: false
    AgentRunListItem:
      type: object
      required: [run_id, state, revision, deadline_at]
      properties:
        run_id: {type: string, minLength: 1, maxLength: 128}
        state: {$ref: '#/components/schemas/AgentRunState'}
        revision: {type: integer, minimum: 1}
        deadline_at: {type: string, format: date-time}
      additionalProperties: false
    AgentRunList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/AgentRunListItem'}
        next_cursor: {type: [string, 'null'], maxLength: 128}
      additionalProperties: false
    AgentRunStatus:
      type: object
      required: [run_id, state, revision, deadline_at, turn_count, transcript_bytes, wake_condition]
      properties:
        run_id: {type: string, minLength: 1, maxLength: 128}
        state: {$ref: '#/components/schemas/AgentRunState'}
        revision: {type: integer, minimum: 1}
        deadline_at: {type: string, format: date-time}
        turn_count: {type: integer, minimum: 0}
        transcript_bytes: {type: integer, minimum: 0}
        wake_condition: {type: [string, 'null'], maxLength: 512}
      additionalProperties: false
    AgentTranscriptItem:
      type: object
      required: [turn_no, speaker, ordinal, text]
      properties:
        turn_no: {type: integer, minimum: 1}
        speaker: {type: string, minLength: 1, maxLength: 32}
        ordinal: {type: integer, minimum: 1}
        text: {type: string, maxLength: 16384}
      additionalProperties: false
    AgentTranscript:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/AgentTranscriptItem'}
        next_cursor: {type: [string, 'null'], maxLength: 128}
      additionalProperties: false
    AgentCancelResult:
      type: object
      required: [run_id, state]
      properties:
        run_id: {type: string, minLength: 1, maxLength: 128}
        state: {type: string, enum: [cancelled, unchanged]}
      additionalProperties: false
    ApprovalListItem:
      type: object
      description: Owner-visible approval row. Active rows include args and preview; terminal rows omit them (FR-8).
      required: [id, command_id, command_version, revision, status, expires_at, preview_digest]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        command_id: {type: string, minLength: 1, maxLength: 64}
        command_version: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [pending, granted, consumed, denied, revoked, expired, stale]}
        expires_at: {type: string, format: date-time}
        preview_digest: {type: string, minLength: 64, maxLength: 64}
        title: {type: string, maxLength: 240}
        impacted_versions_count: {type: integer, minimum: 0}
        run_id: {type: string, maxLength: 128}
        args: {type: object}
        preview: {type: object}
      additionalProperties: false
    ApprovalList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ApprovalListItem'}}
        next_cursor: {type: [string, 'null'], maxLength: 512}
      additionalProperties: false
    ApprovalDetail:
      type: object
      allOf:
      - $ref: '#/components/schemas/ApprovalListItem'
      additionalProperties: false
    ApprovalDecisionInput:
      type: object
      required: [expected_revision, preview_digest]
      properties:
        expected_revision: {type: integer, minimum: 1}
        preview_digest: {type: string, minLength: 64, maxLength: 64}
      additionalProperties: false
    ApprovalDecisionResult:
      type: object
      required: [id, revision, status]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [pending, granted, consumed, denied, revoked, expired, stale]}
      additionalProperties: false
    AgentErrorEnvelope:
      type: object
      description: Stable delegated-run error envelope; details are typed path/problem pairs, never model text.
      required: [ok, error]
      properties:
        ok: {type: boolean, const: false}
        error: {$ref: '#/components/schemas/CommandError'}
      additionalProperties: false

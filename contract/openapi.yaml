openapi: 3.1.0
info:
  title: Parley local owner API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Local service readiness. Does not probe a model.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/Error'}
  /session/bootstrap:
    post:
      operationId: redeemBootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BootstrapRequest'}
      responses:
        '200': {description: One-time bootstrap redeemed; sets an HttpOnly session cookie.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /session:
    get:
      operationId: getSession
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Private workspace session and mutation token.
          headers:
            X-Parley-Epoch: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Error'}
  /entities:
    get:
      operationId: listEntities
      security: [{sessionCookie: []}]
      parameters:
        - in: query
          name: kind
          required: false
          description: >
            Repeated values OR together (RFC-0004 §4.3). Owner-resource kinds
            are gift, proof, artifact and the aggregate resource; directory
            kinds are person, org and project. Without the filter both entity
            families are returned.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string, enum: [gift, proof, artifact, resource, person, org, project]}
      responses:
        '200':
          description: Saved workspace entities, newest resources first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntityList'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      operationId: createEntity
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/CreateResource'}
                - {$ref: '#/components/schemas/EntityInput'}
      responses:
        '201':
          description: New entity and receipt committed atomically.
          headers: {ETag: {schema: {type: string}}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: {data: {$ref: '#/components/schemas/Entity'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /entities/{id}:
    get:
      operationId: getEntity
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200':
          description: One saved resource with its current strong ETag.
          headers: {ETag: {schema: {type: string}}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceEnvelope'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateEntity
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {in: header, name: If-Match, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateResource'}
      responses:
        '200':
          description: Updated draft and receipt committed atomically.
          headers: {ETag: {schema: {type: string}}}
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Resource'}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
  /events:
    get:
      operationId: getEvents
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: after, schema: {type: string, pattern: '^[0-9]+$'}, required: false}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200':
          description: Ordered committed events after the supplied cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /captures:
    get:
      operationId: listCaptures
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200':
          description: Independent source occurrences, newest first.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SavedSource'}}
        '401': {$ref: '#/components/responses/Error'}
    post:
      operationId: saveCapture
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptureInput'}
      responses:
        '201':
          description: Source saved without inferred identity or link.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedSource'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /captures/{id}:
    get:
      operationId: getCaptureOccurrence
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Raw captured occurrence and normalization provenance, content: {application/json: {schema: {$ref: '#/components/schemas/SourceDetail'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /directory:
    get:
      operationId: searchDirectory
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: kind, schema: {type: string, enum: [person, org, project]}}
        - {in: query, name: tag, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Stable, filtered directory order, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryEnvelope'}}}}
  /directory/{id}:
    patch:
      operationId: updateDirectoryProfile
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryProfileInput'}}}}
      responses:
        '200': {description: Directory profile and revision updated, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryEntity'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /graph/{id}:
    get:
      operationId: getNeighborhood
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: view_scope, schema: {type: string}}
        - {in: query, name: view_id, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Bounded neighborhood with attributed current evidence and view layout, content: {application/json: {schema: {$ref: '#/components/schemas/Neighborhood'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /graph/edges:
    post:
      operationId: linkExistingEntity
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LinkExistingInput'}}}}
      responses:
        '201': {description: Existing endpoint records linked with exact attributed evidence, content: {application/json: {schema: {$ref: '#/components/schemas/EdgeReceipt'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /claims/{id}/correction:
    post:
      operationId: correctClaimWording
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimCorrection'}}}}
      responses:
        '200': {description: Owner correction revision, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimCorrectionReceipt'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /layout:
    post:
      operationId: updateViewPosition
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LayoutInput'}}}}
      responses:
        '200': {description: View-specific position saved, content: {application/json: {schema: {$ref: '#/components/schemas/LayoutReceipt'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /graph/related:
    post:
      operationId: createRelatedEntity
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RelatedEntityInput'}
      responses:
        '201':
          description: Atomically created entity, attributed edge and layout.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphEntity'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /opportunities:
    get:
      operationId: listOpportunities
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Opportunities with canonical participant IDs, content: {application/json: {schema: {$ref: '#/components/schemas/OpportunityList'}}}}
    post:
      operationId: createOpportunity
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateOpportunity'}}}}
      responses:
        '201': {description: Opportunity and owner event committed, content: {application/json: {schema: {$ref: '#/components/schemas/Opportunity'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /board:
    get:
      operationId: getBoard
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Ordered custom lists and canonical opportunity cards, content: {application/json: {schema: {$ref: '#/components/schemas/BoardSnapshot'}}}}
  /board/lists:
    post:
      operationId: createBoardList
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateBoardList'}}}}
      responses:
        '201': {description: Board with the new active list, content: {application/json: {schema: {$ref: '#/components/schemas/BoardSnapshot'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /board/lists/order:
    put:
      operationId: reorderBoardLists
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReorderBoardLists'}}}}
      responses:
        '200': {description: Lists reordered, content: {application/json: {schema: {$ref: '#/components/schemas/BoardSnapshot'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /board/lists/{id}:
    patch:
      operationId: renameBoardList
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RenameBoardList'}}}}
      responses:
        '200': {description: Board with the renamed list, content: {application/json: {schema: {$ref: '#/components/schemas/BoardSnapshot'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /board/lists/{id}/archive:
    post:
      operationId: archiveBoardList
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArchiveBoardList'}}}}
      responses:
        '200': {description: Cards moved and list archived atomically, content: {application/json: {schema: {$ref: '#/components/schemas/BoardSnapshot'}}}}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /board/cards/{id}/move:
    post:
      operationId: moveBoardCard
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MoveBoardCard'}}}}
      responses:
        '200': {description: Card moved without changing opportunity state or deadlines, content: {application/json: {schema: {$ref: '#/components/schemas/BoardSnapshot'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /board/lists/{id}/cards/reorder:
    post:
      operationId: reorderBoardCard
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReorderBoardCard'}}}}
      responses:
        '200': {description: Card reordered within its list, content: {application/json: {schema: {$ref: '#/components/schemas/BoardSnapshot'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /opportunities/{id}/participants:
    put:
      operationId: updateOpportunityParticipants
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OpportunityParticipantsInput'}}}}
      responses:
        '200': {description: Participant set and opportunity revision, content: {application/json: {schema: {$ref: '#/components/schemas/Opportunity'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /opportunities/{id}/interests:
    get:
      operationId: listOpportunityInterests
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Owner-confirmed interests for the opportunity, content: {application/json: {schema: {$ref: '#/components/schemas/InterestList'}}}}
    post:
      operationId: createInterest
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateInterest'}}}}
      responses:
        '201': {description: Owner-authored interest, content: {application/json: {schema: {$ref: '#/components/schemas/Interest'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /opportunities/{id}/exchange:
    get:
      operationId: getOpportunityExchange
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Current versioned exchange or null, content: {application/json: {schema: {$ref: '#/components/schemas/ExchangeResponse'}}}}
    put:
      operationId: updateExchange
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExchangeInput'}}}}
      responses:
        '200': {description: New exchange version, attestation reset, content: {application/json: {schema: {$ref: '#/components/schemas/Exchange'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /opportunities/{id}/materials:
    get:
      operationId: listOpportunityMaterials
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Canonical materials in this opportunity, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialList'}}}}
    post:
      operationId: createMaterial
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateMaterial'}}}}
      responses:
        '201': {description: Material bound to one opportunity and recipient, content: {application/json: {schema: {$ref: '#/components/schemas/Material'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /opportunities/{id}/notes:
    get:
      operationId: getOpportunityNotes
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Canonical Markdown and revision, content: {application/json: {schema: {$ref: '#/components/schemas/OpportunityNotes'}}}}
    put:
      operationId: saveOpportunityNotes
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveOpportunityNotes'}}}}
      responses:
        '200': {description: Canonical Markdown saved with new revision, content: {application/json: {schema: {$ref: '#/components/schemas/OpportunityNotes'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /opportunities/{id}/notes/tasks:
    patch:
      operationId: toggleOpportunityTask
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ToggleOpportunityTask'}}}}
      responses:
        '200': {description: One exact task marker changed in canonical Markdown, content: {application/json: {schema: {$ref: '#/components/schemas/OpportunityNotes'}}}}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /materials/{id}:
    get:
      operationId: getMaterial
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Current output version and canonical lineage, content: {application/json: {schema: {$ref: '#/components/schemas/Material'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /materials/{id}/versions:
    put:
      operationId: saveMaterialVersion
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveMaterialVersion'}}}}
      responses:
        '200': {description: Immutable output version created; historical versions remain unchanged, content: {application/json: {schema: {$ref: '#/components/schemas/Material'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /materials/{id}/gate:
    get:
      operationId: getMaterialGate
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: version_id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Deterministic server gate results for exact current version and recipient, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialGate'}}}}
  /materials/{id}/approval:
    post:
      operationId: approveMaterialVersion
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApproveMaterial'}}}}
      responses:
        '201': {description: Version-bound approval and gate snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialApproval'}}}}
        '422': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
  /materials/{id}/copy-grant:
    post:
      operationId: issueCopyGrant
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CopyGrantRequest'}}}}
      responses:
        '201': {description: Authorized exact approved text for one recipient and version, content: {application/json: {schema: {$ref: '#/components/schemas/CopyGrant'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
  /copy-grants/{id}:
    get:
      operationId: getCopyGrantReceipt
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Receipt status without reissuing content bytes, content: {application/json: {schema: {$ref: '#/components/schemas/CopyGrantReceipt'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /copy-grants/{id}/acknowledgement:
    post:
      operationId: acknowledgeCopy
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CopyAcknowledgement'}}}}
      responses:
        '200': {description: Browser-reported clipboard promise outcome only; creates no send or timer, content: {application/json: {schema: {$ref: '#/components/schemas/CopyGrantReceipt'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /capture-stages:
    post:
      operationId: stageCapture
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StageCapture'}}}}
      responses:
        '202': {description: Raw source occurrence and durable Extractor job staged; no proposal is accepted, content: {application/json: {schema: {$ref: '#/components/schemas/CaptureStage'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /capture-stages/{id}:
    get:
      operationId: getCaptureReview
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Staged source, durable job status and proposed items with current review state, content: {application/json: {schema: {$ref: '#/components/schemas/CaptureReview'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /capture-stages/{id}/decisions:
    post:
      operationId: applyCaptureReview
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CaptureReviewDecisions'}}}}
      responses:
        '200': {description: Selected review decisions committed atomically, content: {application/json: {schema: {$ref: '#/components/schemas/CaptureDecisionReceipt'}}}}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /capture-stages/{id}/source-only:
    post:
      operationId: saveCaptureSourceOnly
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewRevisionInput'}}}}
      responses:
        '200': {description: Raw source retained with no proposals applied, content: {application/json: {schema: {$ref: '#/components/schemas/CaptureDecisionReceipt'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /capture-stages/{id}/cancel:
    post:
      operationId: cancelCaptureJob
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CancelCaptureJob'}}}}
      responses:
        '200': {description: Job cancellation recorded; source and staged decisions remain durable, content: {application/json: {schema: {$ref: '#/components/schemas/CaptureStage'}}}}
        '409': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: parley_session}
  parameters:
    MutationToken: {in: header, name: X-Parley-Token, required: true, schema: {type: string}}
    Epoch: {in: header, name: X-Parley-Epoch, required: true, schema: {type: string}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Health:
      type: object
      required: [status, model]
      properties:
        status: {type: string, const: ready}
        model: {type: string, const: not-probed}
      additionalProperties: false
    BootstrapRequest:
      type: object
      required: [secret]
      properties: {secret: {type: string, minLength: 64, maxLength: 64}}
      additionalProperties: false
    Session:
      type: object
      required: [workspace_id, epoch, wire_major, wire_minor, capabilities, mutation_token, cursor]
      properties:
        workspace_id: {type: string}
        epoch: {type: string}
        wire_major: {type: integer}
        wire_minor: {type: integer}
        capabilities: {type: array, items: {type: string}}
        mutation_token: {type: string}
        cursor: {type: string}
      additionalProperties: false
    Resource:
      type: object
      required: [id, kind, title, body, readiness, revision, etag]
      properties:
        id: {type: string}
        kind: {enum: [gift, proof, artifact]}
        title: {type: string}
        body: {type: object, additionalProperties: true}
        readiness: {enum: [draft, ready, retired]}
        revision: {type: integer, minimum: 1}
        etag: {type: string}
      additionalProperties: false
    GraphEntity:
      type: object
      required: [id, kind, name, revision]
      properties:
        id: {type: string}
        kind: {enum: [person, org, project, resource]}
        name: {type: string}
        revision: {type: integer, minimum: 1}
      additionalProperties: false
    DirectoryEntity:
      type: object
      required: [id, kind, name, descriptor, aliases, tags, revision]
      properties:
        id: {type: string}
        kind: {enum: [person, org, project]}
        name: {type: string}
        descriptor: {type: string}
        aliases: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        revision: {type: integer, minimum: 1}
      additionalProperties: false
    DirectoryEnvelope:
      type: object
      required: [data, cursor, total, page, page_size, has_more]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/DirectoryEntity'}}, cursor: {type: string}, total: {type: integer, minimum: 0}, page: {type: integer, minimum: 1}, page_size: {type: integer, minimum: 1}, has_more: {type: boolean}}
      additionalProperties: false
    DirectoryProfileInput:
      type: object
      required: [expected_revision, name, descriptor, aliases, tags]
      properties:
        expected_revision: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 500}
        descriptor: {type: string, maxLength: 1000}
        aliases: {type: array, maxItems: 32, items: {type: string, minLength: 1, maxLength: 200}}
        tags: {type: array, maxItems: 32, items: {type: string, minLength: 1, maxLength: 100}}
      additionalProperties: false
    SourceDetail:
      type: object
      required: [content_id, variant_id, occurrence_id, normalized_sha256, raw_sha256, text, title, url, captured_at, actor_kind, actor_entity_id, normalization_version]
      properties:
        content_id: {type: string}
        variant_id: {type: string}
        occurrence_id: {type: string}
        normalized_sha256: {type: string}
        raw_sha256: {type: string}
        text: {type: string}
        title: {type: [string, 'null']}
        url: {type: [string, 'null']}
        captured_at: {type: string}
        actor_kind: {enum: [owner, party, unknown]}
        actor_entity_id: {type: [string, 'null']}
        normalization_version: {type: integer}
      additionalProperties: false
    Neighborhood:
      type: object
      required: [focus_id, nodes, edges, positions, omitted_nodes, omitted_edges]
      properties:
        focus_id: {type: string}
        nodes: {type: array, items: {$ref: '#/components/schemas/DirectoryEntity'}}
        edges: {type: array, items: {type: object, additionalProperties: true}}
        positions: {type: array, items: {type: object, additionalProperties: true}}
        omitted_nodes: {type: integer, minimum: 0}
        omitted_edges: {type: integer, minimum: 0}
      additionalProperties: false
    ClaimCorrection:
      type: object
      required: [expected_revision, wording]
      properties: {expected_revision: {type: integer, minimum: 1}, wording: {type: string, minLength: 1, maxLength: 2000}}
      additionalProperties: false
    ClaimCorrectionReceipt:
      type: object
      required: [claim_id, revision, approved_wording]
      properties: {claim_id: {type: string}, revision: {type: integer}, approved_wording: {type: string}}
      additionalProperties: false
    LayoutInput:
      type: object
      required: [view_scope, view_id, entity_id, expected_revision, x, y]
      properties: {view_scope: {type: string}, view_id: {type: string}, entity_id: {type: string}, expected_revision: {type: integer, minimum: 0}, x: {type: number}, y: {type: number}}
      additionalProperties: false
    LayoutReceipt:
      type: object
      required: [entity_id, revision, x, y]
      properties: {entity_id: {type: string}, revision: {type: integer}, x: {type: number}, y: {type: number}}
      additionalProperties: false
    LinkExistingInput:
      type: object
      required: [from_id, to_id, verb, occurrence_id, quote]
      properties: {from_id: {type: string}, to_id: {type: string}, verb: {type: string}, occurrence_id: {type: string}, quote: {type: string, minLength: 1}}
      additionalProperties: false
    EdgeReceipt:
      type: object
      required: [edge_id]
      properties: {edge_id: {type: string}}
      additionalProperties: false
    OpportunityParticipant:
      type: object
      required: [id, kind, name]
      properties: {id: {type: string}, kind: {enum: [person, org]}, name: {type: string}}
      additionalProperties: false
    Opportunity:
      type: object
      required: [id, title, status, revision, participants, created_at, updated_at]
      properties:
        id: {type: string}
        title: {type: string}
        status: {enum: [open, resolved, timed_out, archived]}
        revision: {type: integer, minimum: 1}
        participants: {type: array, items: {$ref: '#/components/schemas/OpportunityParticipant'}}
        created_at: {type: string}
        updated_at: {type: string}
      additionalProperties: false
    OpportunityList:
      type: object
      required: [data, cursor]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/Opportunity'}}, cursor: {type: string}}
      additionalProperties: false
    BoardList:
      type: object
      required: [id, name, position, revision, archived]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 120}
        position: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
        archived: {type: boolean}
      additionalProperties: false
    OpportunityBoardItem:
      type: object
      required: [id, title, status, revision, participants, list_id, position, tags, next_task, deadline, missing_material]
      properties:
        id: {type: string}
        title: {type: string}
        status: {enum: [open, resolved, timed_out, archived]}
        revision: {type: integer, minimum: 1}
        participants: {type: array, items: {$ref: '#/components/schemas/OpportunityParticipant'}}
        list_id: {type: string}
        position: {type: integer, minimum: 0}
        tags: {type: array, items: {type: string}}
        next_task: {type: [string, 'null']}
        deadline: {type: [string, 'null']}
        missing_material: {type: boolean}
      additionalProperties: false
    BoardSnapshot:
      type: object
      required: [lists, items, board_revision]
      properties:
        lists: {type: array, items: {$ref: '#/components/schemas/BoardList'}}
        items: {type: array, items: {$ref: '#/components/schemas/OpportunityBoardItem'}}
        board_revision: {type: integer, minimum: 1}
      additionalProperties: false
    CreateBoardList:
      type: object
      required: [name, expected_revision]
      properties: {name: {type: string, minLength: 1, maxLength: 120}, expected_revision: {type: integer, minimum: 1}}
      additionalProperties: false
    RenameBoardList:
      type: object
      required: [name, expected_revision]
      properties: {name: {type: string, minLength: 1, maxLength: 120}, expected_revision: {type: integer, minimum: 1}}
      additionalProperties: false
    ReorderBoardLists:
      type: object
      required: [ordered_ids, expected_revision]
      properties: {ordered_ids: {type: array, uniqueItems: true, items: {type: string}}, expected_revision: {type: integer, minimum: 1}}
      additionalProperties: false
    ArchiveBoardList:
      type: object
      required: [destination_list_id, expected_revision]
      properties: {destination_list_id: {type: string}, expected_revision: {type: integer, minimum: 1}}
      additionalProperties: false
    MoveBoardCard:
      type: object
      required: [destination_list_id, anchor_opportunity_id, expected_board_revision, expected_source_revision, expected_destination_revision]
      properties:
        destination_list_id: {type: string}
        anchor_opportunity_id: {type: [string, 'null']}
        expected_board_revision: {type: integer, minimum: 1}
        expected_source_revision: {type: integer, minimum: 1}
        expected_destination_revision: {type: integer, minimum: 1}
      additionalProperties: false
    ReorderBoardCard:
      type: object
      required: [opportunity_id, anchor_opportunity_id, expected_revision]
      properties:
        opportunity_id: {type: string}
        anchor_opportunity_id: {type: [string, 'null']}
        expected_revision: {type: integer, minimum: 1}
      additionalProperties: false
    OpportunityNotes:
      type: object
      required: [opportunity_id, markdown, revision]
      properties: {opportunity_id: {type: string}, markdown: {type: string}, revision: {type: integer, minimum: 1}}
      additionalProperties: false
    SaveOpportunityNotes:
      type: object
      required: [expected_revision, markdown]
      properties: {expected_revision: {type: integer, minimum: 1}, markdown: {type: string, maxLength: 200000}}
      additionalProperties: false
    ToggleOpportunityTask:
      type: object
      required: [expected_revision, start_byte, end_byte, line_hash, checked]
      properties:
        expected_revision: {type: integer, minimum: 1}
        start_byte: {type: integer, minimum: 0}
        end_byte: {type: integer, minimum: 0}
        line_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        checked: {type: boolean}
      additionalProperties: false
    CreateOpportunity:
      type: object
      required: [title, participant_ids]
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        participant_ids: {type: array, uniqueItems: true, items: {type: string}}
      additionalProperties: false
    OpportunityParticipantsInput:
      type: object
      required: [expected_revision, participant_ids]
      properties:
        expected_revision: {type: integer, minimum: 1}
        participant_ids: {type: array, uniqueItems: true, items: {type: string}}
      additionalProperties: false
    CreateInterest:
      type: object
      required: [side, statement]
      properties:
        side: {enum: [me, them]}
        statement: {type: string, minLength: 1, maxLength: 2000}
      additionalProperties: false
    Interest:
      type: object
      required: [id, opportunity_id, side, statement, tier, status, revision]
      properties:
        id: {type: string}
        opportunity_id: {type: string}
        side: {enum: [me, them]}
        statement: {type: string}
        tier: {type: integer, const: 3}
        status: {enum: [active, dismissed]}
        revision: {type: integer, minimum: 1}
      additionalProperties: false
    InterestList:
      type: object
      required: [data]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/Interest'}}}
      additionalProperties: false
    ExchangeInput:
      type: object
      required: [expected_revision, they_get, i_get, interest_ids, fairness_attested]
      properties:
        expected_revision: {type: integer, minimum: 0}
        they_get: {type: string, maxLength: 4000}
        i_get: {type: string, maxLength: 4000}
        interest_ids: {type: array, uniqueItems: true, items: {type: string}}
        fairness_attested: {type: boolean}
      additionalProperties: false
    Exchange:
      type: object
      required: [id, opportunity_id, version, they_get, i_get, interest_ids, fairness_attested, attested_at]
      properties:
        id: {type: string}
        opportunity_id: {type: string}
        version: {type: integer, minimum: 1}
        they_get: {type: string}
        i_get: {type: string}
        interest_ids: {type: array, items: {type: string}}
        fairness_attested: {type: boolean}
        attested_at: {type: [string, 'null']}
      additionalProperties: false
    ExchangeResponse:
      oneOf: [{$ref: '#/components/schemas/Exchange'}, {type: 'null'}]
    CreateMaterial:
      type: object
      required: [recipient_id, kind, title]
      properties:
        recipient_id: {type: string}
        kind: {enum: [outreach, follow_up, handoff]}
        title: {type: string, minLength: 1, maxLength: 240}
      additionalProperties: false
    SentenceClaim:
      type: object
      required: [type]
      properties:
        type: {enum: [self_fact, other_fact, offer, question, ask, generic]}
        ref_kind: {type: [string, 'null']}
        ref_id: {type: [string, 'null']}
      additionalProperties: false
    MaterialSentence:
      type: object
      required: [text, claims, rules]
      properties:
        text: {type: string, maxLength: 4000}
        claims: {type: array, items: {$ref: '#/components/schemas/SentenceClaim'}}
        rules: {type: array, uniqueItems: true, items: {type: string, pattern: '^R[1-7]$'}}
      additionalProperties: false
    ClaimReference:
      type: object
      required: [kind, id, label, tier]
      properties:
        kind: {type: string}
        id: {type: string}
        label: {type: string}
        tier: {type: integer, minimum: 1, maximum: 3}
      additionalProperties: false
    MaterialVersion:
      type: object
      required: [id, material_id, sequence, body, sentences, slot_fills, protected_tokens, digest, created_at]
      properties:
        id: {type: string}
        material_id: {type: string}
        sequence: {type: integer, minimum: 1}
        body: {type: string, maxLength: 20000}
        sentences: {type: array, items: {$ref: '#/components/schemas/MaterialSentence'}}
        slot_fills: {type: object, additionalProperties: {type: string}}
        protected_tokens: {type: array, uniqueItems: true, items: {type: string}}
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        created_at: {type: string}
      additionalProperties: false
    Material:
      type: object
      required: [id, opportunity_id, recipient_id, recipient_kind, recipient_name, kind, title, revision, current_version, versions, claim_references, approval, updated_at]
      properties:
        id: {type: string}
        opportunity_id: {type: string}
        recipient_id: {type: string}
        recipient_kind: {enum: [person, org]}
        recipient_name: {type: string}
        kind: {enum: [outreach, follow_up, handoff]}
        title: {type: string}
        revision: {type: integer, minimum: 1}
        current_version: {oneOf: [{$ref: '#/components/schemas/MaterialVersion'}, {type: 'null'}]}
        versions: {type: array, items: {$ref: '#/components/schemas/MaterialVersion'}}
        claim_references: {type: array, items: {$ref: '#/components/schemas/ClaimReference'}}
        approval: {oneOf: [{$ref: '#/components/schemas/MaterialApproval'}, {type: 'null'}]}
        updated_at: {type: string}
      additionalProperties: false
    MaterialList:
      type: object
      required: [data]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/Material'}}}
      additionalProperties: false
    SaveMaterialVersion:
      type: object
      required: [expected_revision, body, sentences, slot_fills, protected_tokens]
      properties:
        expected_revision: {type: integer, minimum: 1}
        body: {type: string, maxLength: 20000}
        sentences: {type: array, items: {$ref: '#/components/schemas/MaterialSentence'}}
        slot_fills: {type: object, additionalProperties: {type: string}}
        protected_tokens: {type: array, uniqueItems: true, items: {type: string}}
      additionalProperties: false
    GateResult:
      type: object
      required: [id, severity, pass, detail]
      properties:
        id: {type: string}
        severity: {enum: [hard, soft]}
        pass: {type: boolean}
        detail: {type: string}
      additionalProperties: false
    MaterialGate:
      type: object
      required: [material_id, version_id, recipient_id, evaluated_at, results, hard_failures, soft_failures, copy_enabled]
      properties:
        material_id: {type: string}
        version_id: {type: string}
        recipient_id: {type: string}
        evaluated_at: {type: string}
        results: {type: array, items: {$ref: '#/components/schemas/GateResult'}}
        hard_failures: {type: array, items: {type: string}}
        soft_failures: {type: array, items: {type: string}}
        copy_enabled: {type: boolean}
      additionalProperties: false
    ApproveMaterial:
      type: object
      required: [expected_revision, version_id, override_reasons]
      properties:
        expected_revision: {type: integer, minimum: 1}
        version_id: {type: string}
        override_reasons: {type: object, additionalProperties: {type: string, minLength: 10, maxLength: 1000}}
      additionalProperties: false
    MaterialApproval:
      type: object
      required: [id, material_id, version_id, recipient_id, digest, approved_at, gate_snapshot]
      properties:
        id: {type: string}
        material_id: {type: string}
        version_id: {type: string}
        recipient_id: {type: string}
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        approved_at: {type: string}
        gate_snapshot: {$ref: '#/components/schemas/MaterialGate'}
      additionalProperties: false
    CopyGrantRequest:
      type: object
      required: [version_id, recipient_id]
      properties: {version_id: {type: string}, recipient_id: {type: string}}
      additionalProperties: false
    CopyGrant:
      type: object
      required: [grant_id, material_id, version_id, recipient_id, digest, body, expires_at]
      properties:
        grant_id: {type: string}
        material_id: {type: string}
        version_id: {type: string}
        recipient_id: {type: string}
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        body: {type: string}
        expires_at: {type: string}
      additionalProperties: false
    CopyAcknowledgement:
      type: object
      required: [success]
      properties: {success: {type: boolean}}
      additionalProperties: false
    CopyGrantReceipt:
      type: object
      required: [grant_id, material_id, version_id, recipient_id, digest, status, acknowledged_at]
      properties:
        grant_id: {type: string}
        material_id: {type: string}
        version_id: {type: string}
        recipient_id: {type: string}
        digest: {type: string}
        status: {enum: [issued, acknowledged, failed, expired]}
        acknowledged_at: {type: [string, 'null']}
      additionalProperties: false
    StageCapture:
      type: object
      required: [text, title, url, opportunity_ids, actor_kind, actor_entity_id]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000000}
        title: {type: [string, 'null']}
        url: {type: [string, 'null']}
        opportunity_ids: {type: array, uniqueItems: true, items: {type: string}}
        actor_kind: {enum: [owner, party, unknown]}
        actor_entity_id: {type: [string, 'null']}
      additionalProperties: false
    CaptureStage:
      type: object
      required: [batch_id, job_id, status, revision, source, opportunity_ids]
      properties:
        batch_id: {type: string}

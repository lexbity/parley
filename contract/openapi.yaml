openapi: 3.1.0
info:
  title: Parley local owner API
  version: 1.0.0
servers:
- url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Local service readiness. Does not probe a model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Error'
  /session/bootstrap:
    post:
      operationId: redeemBootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: One-time bootstrap redeemed; sets an HttpOnly session cookie.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /session:
    get:
      operationId: getSession
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Private workspace session and mutation token.
          headers:
            X-Parley-Epoch:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
  /entities:
    get:
      operationId: listEntities
      security:
      - sessionCookie: []
      parameters:
      - in: query
        name: kind
        required: false
        description: 'Repeated values OR together (RFC-0004 §4.3). Owner-resource
          kinds are gift, proof, artifact and the aggregate resource; directory kinds
          are person, org and project. Without the filter both entity families are
          returned.

          '
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - gift
            - proof
            - artifact
            - resource
            - person
            - org
            - project
      responses:
        '200':
          description: Saved workspace entities, newest resources first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityList'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      operationId: createEntity
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CreateResource'
              - $ref: '#/components/schemas/EntityInput'
      responses:
        '201':
          description: New entity and receipt committed atomically.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /entities/{id}:
    get:
      operationId: getEntity
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: One saved resource with its current strong ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateEntity
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResource'
      responses:
        '200':
          description: Updated draft and receipt committed atomically.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Resource'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /events:
    get:
      operationId: getEvents
      security:
      - sessionCookie: []
      parameters:
      - in: query
        name: after
        schema:
          type: string
          pattern: ^[0-9]+$
        required: false
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Ordered committed events after the supplied cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /captures:
    get:
      operationId: listCaptures
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Independent source occurrences, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedSource'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: saveCapture
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureInput'
      responses:
        '201':
          description: Source saved without inferred identity or link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSource'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /captures/{id}:
    get:
      operationId: getCaptureOccurrence
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Raw captured occurrence and normalization provenance, content: {application/json: {schema: {$ref: '#/components/schemas/SourceDetail'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /directory:
    get:
      operationId: searchDirectory
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: kind, schema: {type: string, enum: [person, org, project]}}
        - {in: query, name: tag, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Stable, filtered directory order, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryEnvelope'}}}}
  /directory/{id}:
    patch:
      operationId: updateDirectoryProfile
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryProfileInput'}}}}
      responses:
        '200': {description: Directory profile and revision updated, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryEntity'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /graph/{id}:
    get:
      operationId: getNeighborhood
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: view_scope, schema: {type: string}}
        - {in: query, name: view_id, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Bounded neighborhood with attributed current evidence and view layout, content: {application/json: {schema: {$ref: '#/components/schemas/Neighborhood'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /graph/edges:
    post:
      operationId: linkExistingEntity
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LinkExistingInput'}}}}
      responses:
        '201': {description: Existing endpoint records linked with exact attributed evidence, content: {application/json: {schema: {$ref: '#/components/schemas/EdgeReceipt'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /claims/{id}/correction:
    post:
      operationId: correctClaimWording
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimCorrection'}}}}
      responses:
        '200': {description: Owner correction revision, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimCorrectionReceipt'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /layout:
    post:
      operationId: updateViewPosition
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LayoutInput'}}}}
      responses:
        '200': {description: View-specific position saved, content: {application/json: {schema: {$ref: '#/components/schemas/LayoutReceipt'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /graph/related:
    post:
      operationId: createRelatedEntity
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelatedEntityInput'
      responses:
        '201':
          description: Atomically created entity, attributed edge and layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphEntity'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /resources:
    get:
      operationId: listResources
      security:
      - WorkspaceToken: []
      responses:
        '200':
          description: Resource drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
    post:
      operationId: createResource
      security:
      - WorkspaceToken: []
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '409':
          description: Idempotency conflict
  /opportunities:
    get:
      operationId: listOpportunities
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Opportunity records and shared material IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityList'
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
    post:
      operationId: createOpportunity
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityInput'
      responses:
        '201':
          description: Opportunity with explicit primary participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
  /opportunities/{id}:
    get:
      operationId: getOpportunity
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Opportunity detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '404':
          description: Missing opportunity
  /opportunities/{id}/sources/{source_id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    - in: path
      name: source_id
      required: true
      schema:
        type: string
    post:
      operationId: linkOpportunitySource
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Link to the existing source variant
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
    delete:
      operationId: unlinkOpportunitySource
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Remove only this opportunity association
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
  /opportunities/{id}/participants:
    post:
      operationId: addOpportunityParticipant
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantInput'
      responses:
        '200':
          description: Updated explicit membership
  /opportunities/{id}/interests:
    post:
      operationId: addOpportunityInterest
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestInput'
      responses:
        '201':
          description: Recipient-scoped interest with stated knowledge type
  /opportunities/{id}/exchange:
    post:
      operationId: saveOpportunityExchange
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeInput'
      responses:
        '201':
          description: New immutable exchange version with attestation reset
  /opportunities/{id}/exchange/{recipient_id}/attest:
    post:
      operationId: attestOpportunityExchange
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: recipient_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Explicit attestation bound to the current exchange and interest
            digest
  /templates:
    get:
      operationId: listTemplates
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Immutable template versions and lifecycle state
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
    post:
      operationId: createTemplate
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
      responses:
        '201':
          description: Validated immutable template candidate
        '422':
          description: Invalid slots or fixed text
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
  /templates/{id}/approve:
    post:
      operationId: approveTemplate
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '204':
          description: Owner approved this template version
  /templates/{id}/activate:
    post:
      operationId: activateTemplate
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '204':
          description: Revalidated active template version
  /resources/{id}/ready:
    post:
      operationId: markResourceReady
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadyResourceInput'
      responses:
        '204':
          description: Resource passed its kind-specific readiness validator
        '422':
          description: Missing or invalid required evidence
  /opportunities/{id}/materials:
    get:
      operationId: listOpportunityMaterials
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Opportunity materials, same IDs shown in Output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialList'
    post:
      operationId: createMaterial
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialInput'
      responses:
        '201':
          description: Immutable material version bound to participant and exchange.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialRecord'
        '422':
          description: Invalid resolver
          recipient: null
          or sentence binding: null
  /materials/{id}:
    get:
      operationId: getMaterial
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Current immutable material head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialRecord'
  /materials/{id}/versions:
    post:
      operationId: editMaterial
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialInput'
      responses:
        '201':
          description: New immutable version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialRecord'
  /materials/{id}/approve:
    post:
      operationId: approveMaterial
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalInput'
      responses:
        '200':
          description: Version-bound approval and complete gate snapshot
        '422':
          description: Hard gate or unoverridden soft gate blocks approval
  /materials/{id}/release:
    post:
      operationId: releaseMaterial
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Exact approved bytes and committed issuance record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasedMaterial'
        '422':
          description: Current dependency or gate check blocks release
  /releases/{id}/ack:
    post:
      operationId: acknowledgeRelease
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseAckInput'
      responses:
        '204':
          description: Clipboard success or failure recorded independently of approval
  /outputs:
    get:
      operationId: listOutputs
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Searchable index sharing opportunity and material IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialList'
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: parley_session
  parameters:
    MutationToken:
      in: header
      name: X-Parley-Token
      required: true
      schema:
        type: string
    Epoch:
      in: header
      name: X-Parley-Epoch
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required:
      - status
      - model
      properties:
        status:
          type: string
          const: ready
        model:
          type: string
          const: not-probed
      additionalProperties: false

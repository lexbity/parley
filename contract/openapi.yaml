openapi: 3.1.0
info:
  title: Parley local owner API
  version: 1.0.0
servers:
- url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Local service readiness. Does not probe a model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Error'
  /session/bootstrap:
    post:
      operationId: redeemBootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: One-time bootstrap redeemed; sets an HttpOnly session cookie.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /session:
    get:
      operationId: getSession
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Private workspace session and mutation token.
          headers:
            X-Parley-Epoch:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
  /entities:
    get:
      operationId: listEntities
      security:
      - sessionCookie: []
      parameters:
      - in: query
        name: kind
        required: false
        description: 'Repeated values OR together (RFC-0004 §4.3). Owner-resource
          kinds are gift, proof, artifact and the aggregate resource; directory kinds
          are person, org and project. Without the filter both entity families are
          returned.

          '
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - gift
            - proof
            - artifact
            - resource
            - person
            - org
            - project
      responses:
        '200':
          description: Saved workspace entities, newest resources first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityList'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      operationId: createEntity
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CreateResource'
              - $ref: '#/components/schemas/EntityInput'
      responses:
        '201':
          description: New entity and receipt committed atomically.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /entities/{id}:
    get:
      operationId: getEntity
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: One saved resource or directory entity with its current strong ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateEntity
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/UpdateResource'
              - $ref: '#/components/schemas/UpdateEntityInput'
      responses:
        '200':
          description: Updated draft or party and receipt committed atomically.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /party-imports:
    post:
      operationId: stagePartyImport
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Parsed private CSV stage and bounded input limits.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PartyImportStage'
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /party-imports/{id}/preview:
    post:
      operationId: previewPartyImport
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyImportMapping'
      responses:
        '200':
          description: Mapped records and duplicate decisions for this preview.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PartyImportPreview'
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /party-imports/{id}/commit:
    post:
      operationId: commitPartyImport
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyImportCommit'
      responses:
        '201':
          description: Atomic import receipt with canonical party IDs.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PartyImportReceipt'
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /entities/{id}/attachments:
    get:
      operationId: listAttachments
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Private file bindings for the addressed card.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/EntityAttachment'}}
                additionalProperties: false
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: bindEntityAttachment
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindEntityAttachment'
      responses:
        '201':
          description: Private card file binding for a staged upload.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DossierFile'
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /entities/{id}/attachments/{ref}:
    delete:
      operationId: unlinkEntityAttachment
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: ref
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Removed one entity attachment binding.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /entities/{id}/attachments/{ref}/content:
    get:
      operationId: getEntityAttachmentContent
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: ref
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Owner-authorized verified file bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /entities/{id}/notes:
    get:
      operationId: getEntityNotes
      summary: Read canonical party notes with their independent revision
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Canonical Markdown notes and the notes-scoped strong ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityNotesEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: updateEntityNotes
      summary: Replace party notes under notes revision and strong ETag preconditions
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityNotesInput'
      responses:
        '200':
          description: Committed canonical notes with the new notes revision and ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityNotesEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
  /entities/{id}/dossier:
    get:
      operationId: getEntityDossier
      summary: Inspector dossier for one party
      description: >
        Direct links, files, open opportunities and resources used by visible
        opportunities for one party, bounded and deduplicated by ID. Every hop
        carries object IDs so the inspector can explain and navigate each
        association.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Party dossier for the inspector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /entities/{id}/clear-dnc:
    post:
      operationId: clearPartyDnc
      summary: Clear party-wide do-not-contact suppression with an explicit reason
      description: >
        The explicit owner action that re-opens a party after a decline. The
        reason is recorded and the cleared state is authoritative for every
        future gate check. It does not by itself reopen closed threads;
        reopening stays a separate explicit action (BE-08).
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DncClearanceInput'
      responses:
        '200':
          description: Party suppression cleared; the party is eligible for fresh releases again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyPolicyRecord'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /events:
    get:
      operationId: getEvents
      security:
      - sessionCookie: []
      parameters:
      - in: query
        name: after
        schema:
          type: string
          pattern: ^[0-9]+$
        required: false
      - in: query
        name: entity_type
        schema:
          type: string
        required: false
        description: Focused read - restrict the feed to one entity type.
      - in: query
        name: entity_id
        schema:
          type: string
        required: false
        description: Focused read - restrict the feed to one entity id.
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Ordered committed events after the supplied cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /captures:
    get:
      operationId: listCaptures
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Independent source occurrences, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedSource'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: saveCapture
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureInput'
      responses:
        '201':
          description: Source saved independently and Extractor job queued when capacity permits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSource'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /agent/provider:
    get:
      operationId: getAgentProvider
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Saved local provider profile and cached structured-output readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfig'
        '401':
          $ref: '#/components/responses/Error'
    put:
      operationId: updateAgentProvider
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdate'
      responses:
        '204':
          description: Provider configuration saved; health must be checked explicitly.
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /captures/{occurrence_id}/proposals:
    get:
      operationId: getCaptureProposals
      security:
      - sessionCookie: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema: {type: string}
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Durable Extractor job and its staged proposals for this source occurrence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractorJob'
        '404':
          $ref: '#/components/responses/Error'
  /agent/provider/health:
    post:
      operationId: checkAgentProvider
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Local model connectivity and installed tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHealth'
        '202':
          description: Durable structured-output probe queued for the saved profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProbeReceipt'
  /jobs/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getJob
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: Durable job and staged proposals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerJob'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: cancelJob
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Cancellation fenced against any late worker completion.
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /proposals/{batch_id}/resolve:
    post:
      operationId: resolveProposals
      security:
      - sessionCookie: []
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalResolution'
      responses:
        '200':
          description: Selected proposal decisions committed atomically.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          $ref: '#/components/responses/Error'
  /claims/{id}/revisions:
    post:
      operationId: reviseClaim
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRevisionInput'
      responses:
        '201':
          description: Attributed claim revision recorded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ClaimRevisionReceipt'
                additionalProperties: false
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /entities/{id}/usage:
    get:
      operationId: getEntityUsage
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      responses:
        '200':
          description: References affected by retirement.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/EntityUsage'
                additionalProperties: false
        '404':
          $ref: '#/components/responses/Error'
  /entities/{id}/retire:
    post:
      operationId: retireEntity
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/MutationToken'
      - $ref: '#/components/parameters/Epoch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetireEntityInput'
      responses:
        '200':
          description: Retirement recorded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/RetiredEntity'
                additionalProperties: false
        '404':
          $ref: '#/components/responses/Error'
        '409':

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: parley_session
  parameters:
    MutationToken:
      in: header
      name: X-Parley-Token
      required: true
      schema:
        type: string
    Epoch:
      in: header
      name: X-Parley-Epoch
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required:
      - status
      - model
      properties:
        status:
          type: string
          const: ready
        model:
          type: string
          const: not-probed
      additionalProperties: false
    BootstrapRequest:
      type: object
      required:
      - secret
      properties:
        secret:
          type: string
          minLength: 64
          maxLength: 64
      additionalProperties: false
    Session:
      type: object
      required:
      - workspace_id
      - epoch
      - wire_major
      - wire_minor
      - capabilities
      - mutation_token
      - cursor
      properties:
        workspace_id:
          type: string
        epoch:
          type: string
        wire_major:
          type: integer
        wire_minor:
          type: integer
        capabilities:
          type: array
          items:
            type: string
        mutation_token:
          type: string
        cursor:
          type: string
      additionalProperties: false
    Resource:
      type: object
      required:
      - id
      - kind
      - title
      - body
      - readiness
      - revision
      - etag
      properties:
        id:
          type: string
        kind:
          enum:
          - gift
          - proof
          - artifact
        title:
          type: string
        body:
          type: object
          additionalProperties: true
        readiness:
          enum:
          - draft
          - ready
          - retired
        revision:
          type: integer
          minimum: 1
        etag:
          type: string
      additionalProperties: false
    GraphEntity:
      type: object
      required:
      - id
      - kind
      - name
      - revision
      properties:
        id:
          type: string
        kind:
          enum:
          - person
          - org
          - project
          - resource
        name:
          type: string
        revision:
          type: integer
          minimum: 1
      additionalProperties: false
    GraphNode:
      allOf:

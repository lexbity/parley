openapi: 3.1.0
info:
  title: Parley local owner API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Local service readiness. Does not probe a model.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/Error'}
  /session/bootstrap:
    post:
      operationId: redeemBootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BootstrapRequest'}
      responses:
        '200': {description: One-time bootstrap redeemed; sets an HttpOnly session cookie.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /session:
    get:
      operationId: getSession
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Private workspace session and mutation token.
          headers:
            X-Parley-Epoch: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Error'}
  /entities:
    get:
      operationId: listEntities
      security: [{sessionCookie: []}]
      parameters:
        - in: query
          name: kind
          required: false
          description: >
            Repeated values OR together (RFC-0004 §4.3). Owner-resource kinds
            are gift, proof, artifact and the aggregate resource; directory
            kinds are person, org and project. Without the filter both entity
            families are returned.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string, enum: [gift, proof, artifact, resource, person, org, project]}
      responses:
        '200':
          description: Saved workspace entities, newest resources first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntityList'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      operationId: createEntity
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/CreateResource'}
                - {$ref: '#/components/schemas/EntityInput'}
      responses:
        '201':
          description: New entity and receipt committed atomically.
          headers: {ETag: {schema: {type: string}}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: {data: {$ref: '#/components/schemas/Entity'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /entities/{id}:
    get:
      operationId: getEntity
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200':
          description: One saved resource with its current strong ETag.
          headers: {ETag: {schema: {type: string}}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceEnvelope'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateEntity
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {in: header, name: If-Match, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateResource'}
      responses:
        '200':
          description: Updated draft and receipt committed atomically.
          headers: {ETag: {schema: {type: string}}}
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Resource'}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
  /events:
    get:
      operationId: getEvents
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: after, schema: {type: string, pattern: '^[0-9]+$'}, required: false}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200':
          description: Ordered committed events after the supplied cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /captures:
    get:
      operationId: listCaptures
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200':
          description: Independent source occurrences, newest first.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SavedSource'}}
        '401': {$ref: '#/components/responses/Error'}
    post:
      operationId: saveCapture
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptureInput'}
      responses:
        '201':
          description: Source saved without inferred identity or link.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedSource'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /captures/{id}:
    get:
      operationId: getCaptureOccurrence
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Raw captured occurrence and normalization provenance, content: {application/json: {schema: {$ref: '#/components/schemas/SourceDetail'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /directory:
    get:
      operationId: searchDirectory
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: kind, schema: {type: string, enum: [person, org, project]}}
        - {in: query, name: tag, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Stable, filtered directory order, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryEnvelope'}}}}
  /directory/{id}:
    patch:
      operationId: updateDirectoryProfile
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryProfileInput'}}}}
      responses:
        '200': {description: Directory profile and revision updated, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryEntity'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /graph/{id}:
    get:
      operationId: getNeighborhood
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: view_scope, schema: {type: string}}
        - {in: query, name: view_id, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
      responses:
        '200': {description: Bounded neighborhood with attributed current evidence and view layout, content: {application/json: {schema: {$ref: '#/components/schemas/Neighborhood'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /graph/edges:
    post:
      operationId: linkExistingEntity
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LinkExistingInput'}}}}
      responses:
        '201': {description: Existing endpoint records linked with exact attributed evidence, content: {application/json: {schema: {$ref: '#/components/schemas/EdgeReceipt'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /claims/{id}/correction:
    post:
      operationId: correctClaimWording
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimCorrection'}}}}
      responses:
        '200': {description: Owner correction revision, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimCorrectionReceipt'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /layout:
    post:
      operationId: updateViewPosition
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LayoutInput'}}}}
      responses:
        '200': {description: View-specific position saved, content: {application/json: {schema: {$ref: '#/components/schemas/LayoutReceipt'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /graph/related:
    post:
      operationId: createRelatedEntity
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/MutationToken'}
        - {$ref: '#/components/parameters/Epoch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RelatedEntityInput'}
      responses:
        '201':
          description: Atomically created entity, attributed edge and layout.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphEntity'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: parley_session}
  parameters:
    MutationToken: {in: header, name: X-Parley-Token, required: true, schema: {type: string}}
    Epoch: {in: header, name: X-Parley-Epoch, required: true, schema: {type: string}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Health:
      type: object
      required: [status, model]
      properties:
        status: {type: string, const: ready}
        model: {type: string, const: not-probed}
      additionalProperties: false
    BootstrapRequest:
      type: object
      required: [secret]
      properties: {secret: {type: string, minLength: 64, maxLength: 64}}
      additionalProperties: false
    Session:
      type: object
      required: [workspace_id, epoch, wire_major, wire_minor, capabilities, mutation_token, cursor]
      properties:
        workspace_id: {type: string}
        epoch: {type: string}
        wire_major: {type: integer}
        wire_minor: {type: integer}
        capabilities: {type: array, items: {type: string}}
        mutation_token: {type: string}
        cursor: {type: string}
      additionalProperties: false
    Resource:
      type: object
      required: [id, kind, title, body, readiness, revision, etag]
      properties:
        id: {type: string}
        kind: {enum: [gift, proof, artifact]}
        title: {type: string}
        body: {type: object, additionalProperties: true}
        readiness: {enum: [draft, ready, retired]}
        revision: {type: integer, minimum: 1}
        etag: {type: string}
      additionalProperties: false
    GraphEntity:
      type: object
      required: [id, kind, name, revision]
      properties:
        id: {type: string}
        kind: {enum: [person, org, project, resource]}
        name: {type: string}
        revision: {type: integer, minimum: 1}
      additionalProperties: false
    DirectoryEntity:
      type: object
      required: [id, kind, name, descriptor, aliases, tags, revision]
      properties:
        id: {type: string}
        kind: {enum: [person, org, project]}
        name: {type: string}
        descriptor: {type: string}
        aliases: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        revision: {type: integer, minimum: 1}
      additionalProperties: false
    DirectoryEnvelope:
      type: object
      required: [data, cursor, total, page, page_size, has_more]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/DirectoryEntity'}}, cursor: {type: string}, total: {type: integer, minimum: 0}, page: {type: integer, minimum: 1}, page_size: {type: integer, minimum: 1}, has_more: {type: boolean}}
      additionalProperties: false
    DirectoryProfileInput:
      type: object
      required: [expected_revision, name, descriptor, aliases, tags]
      properties:
        expected_revision: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 500}
        descriptor: {type: string, maxLength: 1000}
        aliases: {type: array, maxItems: 32, items: {type: string, minLength: 1, maxLength: 200}}
        tags: {type: array, maxItems: 32, items: {type: string, minLength: 1, maxLength: 100}}
      additionalProperties: false
    SourceDetail:
      allOf:
        - {$ref: '#/components/schemas/SavedSource'}
        - type: object
          required: [text, title, url, captured_at, actor_kind, actor_entity_id, normalization_version]
          properties:
            text: {type: string}
            title: {type: [string, 'null']}
            url: {type: [string, 'null']}
            captured_at: {type: string}
            actor_kind: {type: string}
            actor_entity_id: {type: [string, 'null']}
            normalization_version: {type: integer}
    Neighborhood:
      type: object
      required: [focus_id, nodes, edges, positions, omitted_nodes, omitted_edges]
      properties:
        focus_id: {type: string}
        nodes: {type: array, items: {$ref: '#/components/schemas/DirectoryEntity'}}
        edges: {type: array, items: {type: object, additionalProperties: true}}
        positions: {type: array, items: {type: object, additionalProperties: true}}
        omitted_nodes: {type: integer, minimum: 0}
        omitted_edges: {type: integer, minimum: 0}
      additionalProperties: false
    ClaimCorrection:
      type: object
      required: [expected_revision, wording]
      properties: {expected_revision: {type: integer, minimum: 1}, wording: {type: string, minLength: 1, maxLength: 2000}}
      additionalProperties: false
    ClaimCorrectionReceipt:
      type: object
      required: [claim_id, revision, approved_wording]
      properties: {claim_id: {type: string}, revision: {type: integer}, approved_wording: {type: string}}
      additionalProperties: false
    LayoutInput:
      type: object
      required: [view_scope, view_id, entity_id, expected_revision, x, y]
      properties: {view_scope: {type: string}, view_id: {type: string}, entity_id: {type: string}, expected_revision: {type: integer, minimum: 0}, x: {type: number}, y: {type: number}}
      additionalProperties: false
    LayoutReceipt:
      type: object
      required: [entity_id, revision, x, y]
      properties: {entity_id: {type: string}, revision: {type: integer}, x: {type: number}, y: {type: number}}
      additionalProperties: false
    LinkExistingInput:
      type: object
      required: [from_id, to_id, verb, occurrence_id, quote]
      properties: {from_id: {type: string}, to_id: {type: string}, verb: {type: string}, occurrence_id: {type: string}, quote: {type: string, minLength: 1}}
      additionalProperties: false
    EdgeReceipt:
      type: object
      required: [edge_id]
      properties: {edge_id: {type: string}}
      additionalProperties: false
    Entity:
      oneOf:
        - {$ref: '#/components/schemas/Resource'}
        - {$ref: '#/components/schemas/GraphEntity'}
    EntityList:
      type: object
      required: [data, cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Entity'}}
        cursor: {type: string}
      additionalProperties: false
    ResourceEnvelope:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/Resource'}}
      additionalProperties: false
    Event:
      type: object
      required: [cursor, event_id, entity_type, entity_id, revision, event_type, payload]
      properties:
        cursor: {type: string}
        event_id: {type: string}
        entity_type: {type: string}
        entity_id: {type: string}
        revision: {type: integer}
        event_type: {type: string}
        payload: {type: object, additionalProperties: true}
      additionalProperties: false
    EventPage:
      type: object
      required: [items, next_cursor, observed_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Event'}}
        next_cursor: {type: string}
        observed_cursor: {type: string}
      additionalProperties: false
    CreateResource:
      type: object
      required: [kind, title, body]
      properties:
        kind: {enum: [gift, proof, artifact]}
        title: {type: string, maxLength: 240}
        body: {type: object, additionalProperties: true}
      additionalProperties: false
    UpdateResource:
      type: object
      required: [title, body]
      properties:
        title: {type: string, maxLength: 240}
        body: {type: object, additionalProperties: true}
      additionalProperties: false
    EntityInput:
      type: object
      required: [kind, name]
      properties:
        kind: {enum: [person, org, project, resource]}
        name: {type: string, minLength: 1, maxLength: 500}
      additionalProperties: false
    CaptureInput:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000000}
        title: {type: [string, 'null']}
        url: {type: [string, 'null']}
        actor_kind: {type: string, enum: [owner, party, unknown]}
        actor_entity_id: {type: [string, 'null']}
      additionalProperties: false
    SavedSource:
      type: object
      required: [content_id, variant_id, occurrence_id, normalized_sha256, raw_sha256]
      properties:
        content_id: {type: string}
        variant_id: {type: string}
        occurrence_id: {type: string}
        normalized_sha256: {type: string}
        raw_sha256: {type: string}
      additionalProperties: false
    RelatedEntityInput:
      type: object
      required: [kind, name, related_entity_id, verb, occurrence_id, quote, view_scope, view_id, x, y]
      properties:
        kind: {enum: [person, org, project, resource]}
        name: {type: string}
        related_entity_id: {type: string}
        verb: {type: string}
        occurrence_id: {type: string}
        quote: {type: string}
        view_scope: {type: string}
        view_id: {type: string}
        x: {type: number}
        y: {type: number}
      additionalProperties: false
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: array, items: {type: object}}
          additionalProperties: false
      additionalProperties: false

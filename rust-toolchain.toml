# Pinned Rust toolchain (RFC-0002 BE-01, RFC-0004 S01 toolchain pinning).
# ci/toolchain.py --check verifies the active toolchain matches this file.
# llvm-tools-preview is required by the coverage ratchet (ci/coverage.py).
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy", "llvm-tools-preview"]

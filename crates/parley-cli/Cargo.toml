[package]
name = "parley-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "parley"
path = "src/main.rs"

[dependencies]
parley-service.workspace = true
parley-domain.workspace = true
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util"] }

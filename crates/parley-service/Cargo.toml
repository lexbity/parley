[package]
name = "parley-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
parley-domain.workspace = true
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
hex = "0.4.3"
form_urlencoded = "1.2.1"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util"] }

[build-dependencies]
serde_json = "1.0.154"
